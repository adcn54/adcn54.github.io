let lastIndex = -1;
const box = document.getElementById('ascii-box');
const text = document.getElementById('ascii-text');
const hint = document.getElementById('hint');

function pickRandomArt() {
  let index;
  do {
    index = Math.floor(Math.random() * asciiArts.length);
  } while (index === lastIndex && asciiArts.length > 1);
  lastIndex = index;
  return asciiArts[index];
}

box.addEventListener('mouseenter', function() {
  text.textContent = pickRandomArt();
  text.style.opacity = '1';
  text.style.transform = 'translate(-50%, -50%) scale(1)';
  hint.style.opacity = '0';
  box.style.borderColor = '#ff3700ab';
  box.style.boxShadow = '0 0 20px rgba(255, 81, 0, 0.3), inset 0 0 20px rgba(255, 81, 0, 0.1)';
});

box.addEventListener('mouseleave', function() {
  text.style.opacity = '0';
  text.style.transform = 'translate(-50%, -50%) scale(0.8)';
  hint.style.opacity = '1';
  box.style.borderColor = '#1a2847';
  box.style.boxShadow = 'none';
});
